
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca Escolar</title>
<style>
:root {
  --fondo:#F7F4ED;
  --beige:#E9DFCF;
  --arena:#D9C9B5;
  --marron:#8B7057;
  --oscuro:#594333;
  --blanco:#fff;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--fondo);
  color:var(--oscuro);
  font-family:Arial,sans-serif;
}
header{
  background:var(--oscuro);
  color:white;
  padding:25px 20px;
}
header h1{margin:0;font-size:27px}
header p{color:var(--beige);margin-bottom:0}
main{max-width:850px;margin:auto;padding:18px}
.panel{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:18px;
  box-shadow:0 3px 12px #59433312;
}
h2{font-size:20px;margin-top:0}
input,button{
  width:100%;
  padding:12px;
  border-radius:9px;
  font-size:15px;
  margin:5px 0;
}
input{
  border:1px solid var(--arena);
  background:var(--fondo);
  color:var(--oscuro);
}
button{
  border:0;
  background:var(--marron);
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.45}
.secondary{background:var(--beige);color:var(--oscuro)}
.danger{background:#9B5550}
.book{
  border:1px solid var(--arena);
  border-radius:12px;
  padding:13px;
  margin-top:13px;
  display:flex;
  gap:13px;
  align-items:flex-start;
}
.cover{
  width:85px;
  height:120px;
  object-fit:cover;
  border-radius:7px;
  background:var(--beige);
  flex-shrink:0;
}
.book-info{min-width:0;flex:1}
.book h3{margin:3px 0 9px;overflow-wrap:anywhere}
.book p{margin:6px 0;font-size:14px;overflow-wrap:anywhere}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:10px;
}
.actions button{font-size:13px}
.full{grid-column:1/-1}
#mensaje{font-size:13px;min-height:18px;color:var(--marron)}
.file-label{
  display:block;
  text-align:center;
  padding:12px;
  border:1px dashed var(--marron);
  border-radius:9px;
  margin:8px 0;
  cursor:pointer;
}
#foto{display:none}
#vistaFoto{
  max-width:100px;
  max-height:130px;
  display:none;
  margin:10px auto;
  border-radius:8px;
}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{
  background:var(--beige);
  padding:10px;
  border-radius:9px;
  flex:1;
  min-width:100px;
  text-align:center;
}
.stat strong{display:block;font-size:20px}
@media(max-width:430px){
  .book{gap:9px}
  .cover{width:72px;height:105px}
}
</style>
</head>
<body>

<header>
  <h1>📚 Biblioteca Escolar</h1>
  <p>Organizá tus libros de manera sencilla</p>
</header>

<main>
<section class="panel">
<h2 id="tituloFormulario">Agregar un libro</h2>

<input id="titulo" placeholder="Título del libro">
<input id="autor" placeholder="Autor">
<input id="codigo" placeholder="Código de barras (opcional)">
<input id="cantidad" type="number" min="1" value="1"
 placeholder="Cantidad de ejemplares">

<label class="file-label" for="foto">
  📷 Elegir fotografía de la tapa
</label>
<input id="foto" type="file" accept="image/*">
<img id="vistaFoto" alt="Vista previa de la tapa">

<button onclick="guardarLibro()" id="botonGuardar">
Agregar libro
</button>
<button class="secondary" id="cancelar" onclick="cancelarEdicion()"
 style="display:none">Cancelar edición</button>
<p id="mensaje"></p>
</section>

<section class="panel">
<h2>Mi biblioteca</h2>
<div class="stats">
 <div class="stat"><strong id="total">0</strong>Libros</div>
 <div class="stat"><strong id="ejemplares">0</strong>Ejemplares</div>
 <div class="stat"><strong id="prestados">0</strong>Prestados</div>
</div>
</section>

<section class="panel">
<h2>Catálogo</h2>
<input id="busqueda"
 placeholder="Buscar por título, autor o código..."
 oninput="mostrarLibros()">
<div id="catalogo"></div>
</section>

<section class="panel">
<h2>Copias de seguridad</h2>
<p>Guardá una copia de tu biblioteca o recuperá una copia anterior.</p>
<button onclick="exportar()">Descargar copia de seguridad</button>
<label class="file-label" for="archivoBackup">
  📂 Recuperar copia de seguridad
</label>
<input id="archivoBackup" type="file" accept=".json,application/json">
<p id="mensajeBackup"></p>
</section>
</main>

<script>
let libros=[];
let editando=null;
let fotoActual="";

try {
  libros=JSON.parse(localStorage.getItem("bibliotecaEscolar"))||[];
} catch(e) {
  libros=[];
}

function guardarDatos(){
  try {
    localStorage.setItem("bibliotecaEscolar",JSON.stringify(libros));
    return true;
  } catch(e) {
    alert("No hay espacio suficiente para guardar los datos. Probá con imágenes más pequeñas o descargá una copia de seguridad.");
    return false;
  }
}

function comprimirFoto(archivo){
  return new Promise((resolve,reject)=>{
    const lector=new FileReader();
    lector.onload=()=>{
      const imagen=new Image();
      imagen.onload=()=>{
        const max=500;
        const escala=Math.min(1,max/Math.max(imagen.width,imagen.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.round(imagen.width*escala);
        canvas.height=Math.round(imagen.height*escala);
        const ctx=canvas.getContext("2d");
        ctx.drawImage(imagen,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",0.7));
      };
      imagen.onerror=reject;
      imagen.src=lector.result;
    };
    lector.onerror=reject;
    lector.readAsDataURL(archivo);
  });
}

document.getElementById("foto").addEventListener("change",async e=>{
  const archivo=e.target.files[0];
  if(!archivo)return;
  try{
    fotoActual=await comprimirFoto(archivo);
    const vista=document.getElementById("vistaFoto");
    vista.src=fotoActual;
    vista.style.display="block";
  }catch(e){
    alert("No se pudo cargar la fotografía.");
  }
});

async function guardarLibro(){
  const titulo=document.getElementById("titulo").value.trim();
  const autor=document.getElementById("autor").value.trim();
  const codigo=document.getElementById("codigo").value.trim();
  const cantidad=Number(document.getElementById("cantidad").value);

  if(!titulo||!autor||!Number.isInteger(cantidad)||cantidad<1){
    alert("Completá el título, el autor y una cantidad válida.");
    return;
  }

  if(editando!==null){
    const libro=libros.find(l=>l.id===editando);
    if(!libro)return;
    const prestados=libro.prestamos.length;
    if(cantidad<prestados){
      alert("La cantidad no puede ser menor que los ejemplares prestados.");
      return;
    }
    const anterior={...libro};
    libro.titulo=titulo;
    libro.autor=autor;
    libro.codigo=codigo;
    libro.cantidad=cantidad;
    libro.disponibles=cantidad-prestados;
    libro.foto=fotoActual;
    if(!guardarDatos()){
      Object.assign(libro,anterior);
      return;
    }
  }else{
    libros.push({
      id:Date.now(),
      titulo,autor,codigo,cantidad,
      disponibles:cantidad,
      prestamos:[],
      foto:fotoActual
    });
    if(!guardarDatos()){
      libros.pop();
      return;
    }
  }

  cancelarEdicion();
  mostrarLibros();
  document.getElementById("mensaje").textContent="¡Libro guardado correctamente!";
}

function editar(id){
  const l=libros.find(x=>x.id===id);
  if(!l)return;
  editando=id;
  document.getElementById("titulo").value=l.titulo;
  document.getElementById("autor").value=l.autor;
  document.getElementById("codigo").value=l.codigo;
  document.getElementById("cantidad").value=l.cantidad;
  fotoActual=l.foto||"";
  const vista=document.getElementById("vistaFoto");
  vista.src=fotoActual;
  vista.style.display=fotoActual?"block":"none";
  document.getElementById("tituloFormulario").textContent="Editar libro";
  document.getElementById("botonGuardar").textContent="Guardar cambios";
  document.getElementById("cancelar").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}

function cancelarEdicion(){
  editando=null;
  fotoActual="";
  ["titulo","autor","codigo"].forEach(id=>
    document.getElementById(id).value=""
  );
  document.getElementById("cantidad").value="1";
  document.getElementById("foto").value="";
  document.getElementById("vistaFoto").style.display="none";
  document.getElementById("tituloFormulario").textContent="Agregar un libro";
  document.getElementById("botonGuardar").textContent="Agregar libro";
  document.getElementById("cancelar").style.display="none";
}

function prestar(id){
  const l=libros.find(x=>x.id===id);
  if(!l||l.disponibles<1)return;
  const persona=prompt("¿A quién se presta el libro?");
  if(!persona||!persona.trim())return;
  l.prestamos.push(persona.trim());
  l.disponibles--;
  if(guardarDatos())mostrarLibros();
  else{
    l.prestamos.pop();
    l.disponibles++;
  }
}

function devolver(id){
  const l=libros.find(x=>x.id===id);
  if(!l||!l.prestamos.length)return;
  const persona=prompt("¿Quién devuelve el libro?\n"+l.prestamos.join(", "));
  if(!persona)return;
  const indice=l.prestamos.findIndex(p=>
    p.toLowerCase()===persona.trim().toLowerCase()
  );
  if(indice===-1){
    alert("No encontramos ese préstamo.");
    return;
  }
  const nombre=l.prestamos.splice(indice,1)[0];
  l.disponibles++;
  if(guardarDatos())mostrarLibros();
  else{
    l.prestamos.splice(indice,0,nombre);
    l.disponibles--;
  }
}

function eliminar(id){
  if(!confirm("¿Eliminar este libro y sus registros de préstamos?"))return;
  const indice=libros.findIndex(l=>l.id===id);
  if(indice===-1)return;
  const eliminado=libros.splice(indice,1)[0];
  if(guardarDatos())mostrarLibros();
  else libros.splice(indice,0,eliminado);
}

function crearBoton(texto,clase,accion){
  const b=document.createElement("button");
  b.textContent=texto;
  b.className=clase||"";
  b.onclick=accion;
  return b;
}

function mostrarLibros(){
  const catalogo=document.getElementById("catalogo");
  const texto=document.getElementById("busqueda").value.toLowerCase();
  catalogo.innerHTML="";
  const encontrados=libros.filter(l=>
    [l.titulo,l.autor,l.codigo].some(v=>
      (v||"").toLowerCase().includes(texto)
    )
  );

  document.getElementById("total").textContent=libros.length;
  document.getElementById("ejemplares").textContent=
    libros.reduce((s,l)=>s+l.cantidad,0);
  document.getElementById("prestados").textContent=
    libros.reduce((s,l)=>s+l.prestamos.length,0);

  if(!encontrados.length){
    catalogo.textContent="Todavía no hay libros registrados.";
    return;
  }

  encontrados.forEach(l=>{
    const tarjeta=document.createElement("article");
    tarjeta.className="book";

    if(l.foto){
      const img=document.createElement("img");
      img.className="cover";
      img.src=l.foto;
      img.alt="Tapa de "+l.titulo;
      tarjeta.append(img);
    }

    const info=document.createElement("div");
    info.className="book-info";
    const h=document.createElement("h3");
    h.textContent=l.titulo;
    info.append(h);

    const datos=[
      "Autor: "+l.autor,
      "Código: "+(l.codigo||"Sin código"),
      "Disponibles: "+l.disponibles+" de "+l.cantidad,
      "Préstamos: "+(l.prestamos.join(", ")||"Ninguno")
    ];
    datos.forEach(d=>{
      const p=document.createElement("p");
      p.textContent=d;
      info.append(p);
    });

    const acciones=document.createElement("div");
    acciones.className="actions";
    acciones.append(
      crearBoton("Editar","secondary",()=>editar(l.id)),
      crearBoton("Eliminar","danger",()=>eliminar(l.id)),
      crearBoton("Registrar préstamo","",()=>prestar(l.id)),
      crearBoton("Registrar devolución","",()=>devolver(l.id))
    );
    if(l.disponibles===0)acciones.children[2].disabled=true;
    if(!l.prestamos.length)acciones.children[3].disabled=true;
    info.append(acciones);
    tarjeta.append(info);
    catalogo.append(tarjeta);
  });
}

async function exportar(){
  const copia={
    nombre:"Biblioteca Escolar",
    fecha:new Date().toISOString(),
    libros
  };

  const contenido=JSON.stringify(copia,null,2);

  const archivo=new File(
    [contenido],
    "copia-biblioteca-escolar.json",
    {type:"application/json"}
  );

  try{
    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({files:[archivo]})
    ){
      await navigator.share({
        files:[archivo],
        title:"Copia de Biblioteca Escolar"
      });
    }else{
      const url=URL.createObjectURL(archivo);
      const enlace=document.createElement("a");
      enlace.href=url;
      enlace.download="copia-biblioteca-escolar.json";
      document.body.appendChild(enlace);
      enlace.click();
      enlace.remove();

      setTimeout(()=>{
        URL.revokeObjectURL(url);
      },3000);
    }
  }catch(error){
    if(error.name!=="AbortError"){
      alert("No se pudo compartir la copia. Intentá nuevamente.");
    }
  }
}

document.getElementById("archivoBackup").addEventListener("change",async e=>{
  const archivo=e.target.files[0];
  if(!archivo)return;
  try{
    const contenido=JSON.parse(await archivo.text());
    const nuevos=Array.isArray(contenido)?contenido:contenido.libros;
    if(!Array.isArray(nuevos))throw new Error();
    if(!confirm("La recuperación reemplazará el catálogo actual. ¿Continuar?"))return;
    const anteriores=libros;
    libros=nuevos;
    if(!guardarDatos())libros=anteriores;
    else{
      mostrarLibros();
      document.getElementById("mensajeBackup").textContent="Copia recuperada correctamente.";
    }
  }catch(err){
    alert("El archivo no es una copia válida de Biblioteca Escolar.");
  }
  e.target.value="";
});

mostrarLibros();
</script>
</body>
</html>
